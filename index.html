<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Advanced Deck Builder</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #ecf0f1; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .app-container { width: 950px; background: white; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; }
        .hidden { display: none !important; }
        
        /* 設定画面 */
        .pack-selection label { margin-right: 15px; cursor: pointer; display: inline-block; padding: 5px; border: 1px solid #ddd; border-radius: 4px; }
        
        /* モーダル */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; width: 80%; max-height: 80%; overflow-y: auto; border-radius: 12px; position: relative; }
        
        /* アコーディオン */
        .accordion { border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; overflow: hidden; }
        .acc-header { background: #f8f9fa; padding: 12px; cursor: pointer; font-weight: bold; border-bottom: 1px solid #eee; }
        .acc-header:hover { background: #e9ecef; }
        .acc-body { padding: 15px; display: none; background: white; }
        .acc-body.active { display: block; }

        /* カード選択 (2Pick) */
        .selection-grid { display: flex; justify-content: space-around; gap: 20px; margin-top: 20px; }
        .option-set { width: 45%; border: 3px solid #eee; padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #fff; }
        .option-set:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .card-display { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .card-box { width: 140px; }
        .card-img { width: 100%; height: 190px; background: #34495e; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; overflow: hidden; }
        
        /* リーダー選択 */
        .type-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .type-btn { padding: 25px 10px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; }
        .type-btn:hover { opacity: 0.9; }

        .btn-main { padding: 12px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="view-setup">
        <h1>デッキ構築設定</h1>
        <div class="pack-selection">
            <h3>使用するパックを選択 (1弾〜7弾)
