<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Shadowverse 2Pick Simulator</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #0f172a; --card-panel: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; }
        .app-container { width: 1100px; min-height: 100vh; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.5); background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
        .hidden { display: none !important; }
        
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; text-align: center; }
        .btn-main { background: #3b82f6; color: white; box-shadow: 0 4px 0 #1d4ed8; }
        .btn-pick { background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%); color: white; width: 180px; font-size: 1.1rem; border: 1px solid #22d3ee; margin-top: 15px; }
        .btn-reroll { background: linear-gradient(180deg, #1e293b 0%, #334155 100%); color: #38bdf8; border: 1px solid #38bdf8; padding: 10px 20px; font-size: 0.9rem; }
        .btn-reroll:disabled { opacity: 0.3; cursor: not-allowed; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; padding: 40px; width: 600px; border-radius: 15px; border: 1px solid #334155; position: relative; line-height: 1.6; }

        .selection-area { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 30px; }
        .option-panel { background: var(--card-panel); border: 2px solid #334155; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; min-width: 360px; }
        .card-group { display: flex; gap: 10px; min-height: 200px; }
        .card-item { width: 150px; transition: transform 0.2s; cursor: help; position: relative; }
        .card-item:hover { transform: scale(1.05); }
        .card-img { width: 100%; height: auto; border-radius: 6px; border: 2px solid #475569; }

        .type-select-grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px; }
        .type-option-row { display: flex; align-items: center; background: rgba(51, 65, 85, 0.4); padding: 10px 20px; border-radius: 10px; gap: 20px; border: 1px solid #334155; }
        .preview-img { width: 70px; border-radius: 4px; border: 1px solid #38bdf8; }

        .history-container { margin-top: 40px; border-top: 2px solid #334155; padding-top: 20px; }
        .history-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 10px; }
        .history-item { width: 100%; position: relative; }
        .history-img { width: 100%; height: auto; border-radius: 4px; border: 1px solid #1e293b; }
        
        .count-badge { position: absolute; top: -5px; right: -5px; background: rgba(0,0,0,0.85); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid #38bdf8; pointer-events: none; z-index: 10; }

        .center-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 180px; }
        .reroll-info { font-size: 0.8rem; color: #38bdf8; }
        .acc-header { background: #334155; padding: 10px; cursor: pointer; border-bottom: 1px solid #1e293b; font-weight: bold; }
        .acc-body { padding: 10px; display: none; background: #1e293b; }
        .active { display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="view-setup">
        <h1 style="text-align:center; color:#38bdf8;">2Pick Simulator</h1>
        <p id="loading-status" style="text-align:center;">Loading CSV...</p>
        <div style="background:var(--card-panel); padding:30px; border-radius:15px; border:1px solid #334155;">
            <h3>対象パック選択</h3>
            <div id="pack-checkboxes" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
            <br>
            <button class="btn btn-main" onclick="openModal('modal-ban')">カードBAN設定</button>
            <button class="btn btn-main" style="float:right;" onclick="enterTypeSelection()">入場する</button>
        </div>
    </div>

    <div id="modal-ban" class="modal"><div class="modal-content"><h2>BAN設定</h2><div id="accordion-container" style="max-height:400px; overflow-y:auto;"></div><br><button class="btn btn-main" style="width:100%" onclick="closeModal('modal-ban')">閉じる</button></div></div>
    
    <div id="modal-detail" class="modal" onclick="closeModal('modal-detail')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="detail-name" style="color:#38bdf8; margin-top:0;"></h2>
            <div id="detail-cost" style="font-weight:bold; margin-bottom:10px;"></div>
            <div id="detail-desc" style="white-space: pre-wrap; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;"></div>
            <br>
            <button class="btn btn-main" style="width:100%" onclick="closeModal('modal-detail')">閉じる</button>
        </div>
    </div>

    <div id="view-type-select" class="hidden">
        <h2 style="text-align:center;">クラスを選択してください</h2>
        <div id="type-options" class="type-select-grid"></div>
    </div>

    <div id="view-draft" class="hidden">
        <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #334155; padding-bottom: 10px;">
            <h2 id="current-type-label" style="margin:0; color:#38bdf8;"></h2>
            <div id="draft-progress" style="font-size:1.5rem; font-weight:bold;">1 / 20 Pick</div>
        </div>

        <div id="draft-complete-msg" class="hidden" style="text-align:center; padding:30px; background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); border-radius:10px; margin-top:20px; border: 1px solid #3b82f6;">
            <h2 style="margin:0;">Deck Complete!</h2>
            <p style="margin: 5px 0 0 0;">40枚すべてのカードが選ばれました。</p>
        </div>

        <div id="selection-controls">
            <div class="selection-area">
                <div class="option-panel"><div class="card-group" id="display-A"></div><button class="btn btn-pick" onclick="handlePick('A')">左を選択</button></div>
                <div class="center-controls">
                    <button id="reroll-button" class="btn btn-reroll" onclick="handleReroll()">再抽選</button>
                    <div id="reroll-count-display" class="reroll-info">残り: 0回</div>
                </div>
                <div class="option-panel"><div class="card-group" id="display-B"></div><button class="btn btn-pick" onclick="handlePick('B')">右を選択</button></div>
            </div>
        </div>

        <div class="history-container">
            <h4 style="margin:0; color:#94a3b8;">Pick履歴 (<span id="deck-count">0</span> / 40)</h4>
            <div id="history-display" class="history-grid"></div>
        </div>
    </div>
</div>

<script>
    const CLASS_NAMES = { 0: "ニュートラル", 1: "エルフ", 2: "ロイヤル", 3: "ウィッチ", 4: "ドラゴン", 5: "ナイトメア", 6: "ビショップ", 7: "ネメシス" };
    const NEUTRAL_CHANCE = 0.20;
    const REROLL_LIMITS = { 1: 2, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2 };

    let masterCards = []; let activeCards = []; let myDeck = [];
    let selectedType = 0; let currentPickCount = 1; 
    let currentOptions = { A: [], B: [] };
    let remainingRerolls = 0;
    let typePreviewCards = {};

    window.addEventListener('DOMContentLoaded', () => {
        fetch('data/cards.csv').then(res => res.text()).then(text => {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
            for (let i = 1; i < lines.length; i++) {
                const d = lines[i].split(',').map(item => item.trim());
                if (d.length < 6) continue;
                masterCards.push({ 
                    id: d[0], name: d[1], pack: parseInt(d[2]), type: parseInt(d[3]), 
                    rarity: parseInt(d[4]), image_id: d[5], cost: parseInt(d[6]), 
                    desc: d[7].replace(/\\n/g, '\n'), isBanned: false 
                });
            }
            document.getElementById('loading-status').innerText = "Load OK";
            renderPackChecks();
            renderBanSettings();
        });
    });

    function renderPackChecks() {
        const area = document.getElementById('pack-checkboxes');
        for(let i=0; i<=7; i++) area.innerHTML += `<label style="background:#334155; padding:8px; border-radius:5px; cursor:pointer; margin-right:5px;"><input type="checkbox" class="pack-chk" value="${i}" checked> ${i===0?'Basic':i+'弾'}</label>`;
    }

    function renderBanSettings() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = '';
        [0,1,2,3,4,5,6,7].forEach(i => {
            const div = document.createElement('div');
            div.innerHTML = `<div class="acc-header" onclick="this.nextElementSibling.classList.toggle('active')">${CLASS_NAMES[i]} ▼</div>
                <div class="acc-body">${masterCards.filter(c=>c.type===i).map(c=>`<label style="display:block;"><input type="checkbox" onchange="masterCards.find(m=>m.id==='${c.id}').isBanned=!this.checked" checked> ${c.name}</label>`).join('')}</div>`;
            container.appendChild(div);
        });
    }

    function enterTypeSelection() {
        const selectedPacks = Array.from(document.querySelectorAll('.pack-chk:checked')).map(el => parseInt(el.value));
        activeCards = masterCards.filter(c => !c.isBanned && selectedPacks.includes(c.pack));
        document.getElementById('view-setup').classList.add('hidden');
        document.getElementById('view-type-select').classList.remove('hidden');
        
        const container = document.getElementById('type-options');
        container.innerHTML = '';
        for(let i=1; i<=7; i++) {
            const pool = activeCards.filter(c => c.type === i && c.rarity >= 2);
            typePreviewCards[i] = pool.sort(() => 0.5 - Math.random()).slice(0, 2);
            const row = document.createElement('div');
            row.className = 'type-option-row';
            row.innerHTML = `<button class="btn btn-main" style="width:180px;" onclick="startDraft(${i})">${CLASS_NAMES[i]}</button>
                <div class="preview-imgs">${typePreviewCards[i].map(p => `<img src="image/${p.image_id}.png" class="preview-img" onerror="this.src='https://via.placeholder.com/70x95?text=Card'">`).join('')}</div>`;
            container.appendChild(row);
        }
    }

    function startDraft(classId) {
        selectedType = classId;
        remainingRerolls = REROLL_LIMITS[classId] || 0;
        myDeck = [...typePreviewCards[classId]];
        document.getElementById('view-type-select').classList.add('hidden');
        document.getElementById('view-draft').classList.remove('hidden');
        document.getElementById('current-type-label').innerText = `クラス: ${CLASS_NAMES[classId]}`;
        updateUI();
        nextPick();
    }

    function handleReroll() {
        if(remainingRerolls > 0) {
            remainingRerolls--;
            nextPick(true);
        }
    }

    function nextPick(isReroll = false) {
        if(currentPickCount >= 20 && !isReroll) return;

        let targetRarities = [0, 1, 2, 3];
        if (!isReroll) {
            if (currentPickCount === 1 || currentPickCount === 3 || currentPickCount === 5 || currentPickCount === 7 || currentPickCount === 9 || currentPickCount === 11 || currentPickCount === 13 || currentPickCount === 15 || currentPickCount === 17) {
                targetRarities = [0];
            }
            if (currentPickCount === 2 || currentPickCount === 4 || currentPickCount === 8 || currentPickCount === 10 || currentPickCount === 12 || currentPickCount === 16 || currentPickCount === 18) {
                targetRarities = [1];
            }
            if (currentPickCount === 6 || currentPickCount === 14 || currentPickCount === 19) {
                targetRarities = [2, 3]; // 最初と最後は金・虹確定
            }
        }

        const drawn = [];
        while(drawn.length < 4) {
            const card = drawOne(targetRarities);
            if(!drawn.some(d => d.id === card.id)) {
                drawn.push(card);
            }
        }

        currentOptions.A = [drawn[0], drawn[1]];
        currentOptions.B = [drawn[2], drawn[3]];
        renderChoices();
    }

    function drawOne(rarities) {
        const pool = activeCards.filter(c => (Math.random() < NEUTRAL_CHANCE ? c.type === 0 : c.type === selectedType) && rarities.includes(c.rarity));
        const finalPool = pool.length > 0 ? pool : activeCards.filter(c => rarities.includes(c.rarity));
        return finalPool[Math.floor(Math.random() * finalPool.length)];
    }

    function renderChoices() {
        ['A', 'B'].forEach(L => {
            const container = document.getElementById(`display-${L}`);
            container.innerHTML = currentOptions[L].map(c => `
                <div class="card-item" onclick="showDetail('${c.id}')">
                    <img src="image/${c.image_id}.png" class="card-img" onerror="this.src='https://via.placeholder.com/150x200?text=${encodeURIComponent(c.name)}'">
                </div>`).join('');
        });
    }

    function handlePick(L) {
        myDeck.push(...currentOptions[L]);
        currentPickCount++;
        
        updateUI();

        if(currentPickCount > 20) {
            document.getElementById('selection-controls').classList.add('hidden');
            document.getElementById('draft-complete-msg').classList.remove('hidden');
        } else {
            nextPick();
        }
    }

    function updateUI() {
        document.getElementById('deck-count').innerText = myDeck.length;
        const displayCount = Math.min(currentPickCount, 20);
        document.getElementById('draft-progress').innerText = `${displayCount} / 20 Pick`;
        
        document.getElementById('reroll-count-display').innerText = `残り再抽選: ${remainingRerolls}回`;
        document.getElementById('reroll-button').disabled = (remainingRerolls <= 0 || currentPickCount > 20);

        const history = document.getElementById('history-display');
        const grouped = [];
        const sortedDeck = [...myDeck].sort((a, b) => (a.cost - b.cost) || (a.id.localeCompare(b.id)));
        
        sortedDeck.forEach(card => {
            const existing = grouped.find(g => g.id === card.id);
            if (existing) {
                existing.count++;
            } else {
                grouped.push({ ...card, count: 1 });
            }
        });

        history.innerHTML = grouped.map(g => `
            <div class="history-item" onclick="showDetail('${g.id}')">
                <img src="image/${g.image_id}.png" class="history-img" title="${g.name}">
                <div class="count-badge">×${g.count}</div>
            </div>`).join('');
    }

    function showDetail(id) {
        const c = masterCards.find(m => m.id === id);
        if(!c) return;
        document.getElementById('detail-name').innerText = c.name;
        document.getElementById('detail-cost').innerText = `コスト: ${c.cost}`;
        document.getElementById('detail-desc').innerText = c.desc;
        openModal('modal-detail');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
</script>
</body>
</html>
