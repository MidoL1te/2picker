<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Deck Builder - 2択でデッキ作成</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-color: #3498db;
        }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        
        /* カード選択エリア */
        .selection-area { display: flex; justify-content: space-around; gap: 20px; margin-top: 30px; }
        .option-set { 
            background: var(--card-bg); border: 2px solid #ddd; border-radius: 12px; padding: 15px; width: 45%; 
            cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .option-set:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        
        .card-visuals { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .card-img { width: 100px; height: 140px; background: #eee; object-fit: cover; border-radius: 5px; }
        
        /* ステータス表示 */
        .status { margin: 20px 0; font-size: 1.2rem; font-weight: bold; }
        .deck-list { margin-top: 30px; text-align: left; background: white; padding: 20px; border-radius: 8px; width: 100%; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>デッキ構築システム</h1>
    
    <div id="setup-area">
        <p>まず、カード情報のCSVファイルを読み込んでください。</p>
        <input type="file" id="csv-file" accept=".csv">
    </div>

    <div id="game-area" class="hidden">
        <div class="status">
            進捗: <span id="progress">0</span> / 40 枚
        </div>
        
        <div class="selection-area">
            <div class="option-set" onclick="selectOption('A')">
                <h3>セット A</h3>
                <div class="card-visuals" id="visual-A"></div>
                <p id="text-A"></p>
            </div>
            
            <div class="option-set" onclick="selectOption('B')">
                <h3>セット B</h3>
                <div class="card-visuals" id="visual-B"></div>
                <p id="text-B"></p>
            </div>
        </div>
    </div>

    <div id="result-area" class="hidden">
        <h2>デッキ完成！</h2>
        <div class="deck-list" id="final-deck"></div>
        <button onclick="location.reload()">最初から作り直す</button>
    </div>
</div>

<script>
    let allCards = [];
    let myDeck = [];
    let currentOptions = { A: [], B: [] };
    const TARGET_SIZE = 40;

    // CSVの読み込み処理
    document.getElementById('csv-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const text = event.target.result;
            parseCSV(text);
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            nextTurn();
        };
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split('\n');
        const headers = lines[0].split(',');
        for (let i = 1; i < lines.length; i++) {
            const data = lines[i].split(',');
            if (data.length === headers.length) {
                allCards.push({
                    id: data[0],
                    name: data[1],
                    image: data[2],
                    desc: data[3]
                });
            }
        }
    }

    function nextTurn() {
        if (myDeck.length >= TARGET_SIZE) {
            showResult();
            return;
        }

        // ランダムに4枚選出
        const shuffled = [...allCards].sort(() => 0.5 - Math.random());
        currentOptions.A = [shuffled[0], shuffled[1]];
        currentOptions.B = [shuffled[2], shuffled[3]];

        updateUI();
    }

    function updateUI() {
        document.getElementById('progress').innerText = myDeck.length;
        
        // セットAの表示
        renderOption('A');
        // セットBの表示
        renderOption('B');
    }

    function renderOption(type) {
        const container = document.getElementById(`visual-${type}`);
        const textElem = document.getElementById(`text-${type}`);
        container.innerHTML = '';
        
        currentOptions[type].forEach(card => {
            const img = document.createElement('img');
            img.src = `images/${card.image}`; // 画像フォルダのパス
            img.alt = card.name;
            img.className = 'card-img';
            // 画像がない場合のフォールバック
            img.onerror = () => { img.src = 'https://via.placeholder.com/100x140?text=No+Image'; };
            container.appendChild(img);
        });
        
        textElem.innerText = currentOptions[type].map(c => c.name).join(' & ');
    }

    function selectOption(type) {
        myDeck.push(...currentOptions[type]);
        nextTurn();
    }

    function showResult() {
        document.getElementById('game-area').classList.add('hidden');
        document.getElementById('result-area').classList.remove('hidden');
        
        const list = document.getElementById('final-deck');
        const counts = {};
        myDeck.forEach(card => {
            counts[card.name] = (counts[card.name] || 0) + 1;
        });

        let html = '<ul>';
        for (const [name, count] of Object.entries(counts)) {
            html += `<li>${name} × ${count}</li>`;
        }
        html += '</ul>';
        list.innerHTML = html;
    }
</script>

</body>
</html>
